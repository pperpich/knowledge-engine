name: Validate knowledge graph

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate records and build catalogs
        run: npm run check

      - name: Upload generated catalogs
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-catalog
          path: catalog/*.jsonl
          if-no-files-found: error
